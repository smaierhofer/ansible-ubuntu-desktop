---

- name: Install OpenVPN and related client packages
  become: yes
  apt:
    name:
      - network-manager-openvpn-gnome
      - openconnect
      - network-manager-openconnect
      - network-manager-openconnect-gnome
    state: latest
    update_cache: yes
  tags:
    - openvpn

- name: Ensure /etc/openvpn exists
  become: yes
  file:
    path: /etc/openvpn
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags:
    - openvpn
