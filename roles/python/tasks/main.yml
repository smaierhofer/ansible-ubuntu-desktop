---

- name: Add deadsnakes PPA for Python 3.11
  become: true
  apt_repository:
    repo: ppa:deadsnakes/ppa
    state: present
  tags:
    - python

- name: Update apt cache after adding deadsnakes PPA
  become: true
  apt:
    update_cache: yes
  tags:
    - python

- name: Install Python 3.11 and related packages
  become: true
  apt:
    pkg:
      - python3
      - python3-dev
      - python3-pip
      - python3-venv
      - python3-tk
      - python3.11
      - python3.11-dev
      - python3.11-venv
      - python3.11-tk
    state: latest
    update_cache: yes
    cache_valid_time: "{{ aptcachetime }}"
  tags:
    - python
